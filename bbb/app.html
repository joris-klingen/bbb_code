<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBB Restyle</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc;
    --accent: #e8590c; --accent-ink: #ffffff; --ok: #2f9e44; --warn: #b8730a; --err: #e03131; --chip: #efede8;
    --hit: #fff1e6; --new: #e8590c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #9b9a95; --line: #33332f;
            --accent: #ff7a2e; --accent-ink: #161615; --warn: #e0a030; --chip: #2a2a27; --hit: #3a2618; --new: #ff9a5c; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); padding-bottom: 72px;
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  header { display: flex; gap: 10px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line);
           background: var(--panel); position: sticky; top: 0; z-index: 3; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 6px 0 0; letter-spacing: .02em; }
  .ctl { display: contents; }
  select, input[type=text], input[type=search] { font: inherit; color: var(--ink); background: var(--bg);
           border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  #folder { min-width: 130px; } #search { width: 170px; }
  #project { min-width: 200px; } #version { min-width: 220px; } #path { flex: 1; min-width: 200px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button { white-space: nowrap; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 12px; background: var(--panel); }
  .seg button.on { background: var(--ink); color: var(--panel); }
  main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 132px); }
  aside { border-right: 1px solid var(--line); padding: 16px; background: var(--panel); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .toggle { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center;
            padding: 8px 0; border-bottom: 1px solid var(--line); }
  .toggle .desc { grid-column: 2 / 4; color: var(--muted); font-size: 12px; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
  .count { font-variant-numeric: tabular-nums; font-size: 12px; background: var(--chip); border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
  .count.zero { opacity: .45; }
  .sep { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--warn); }
  .content { padding: 16px 24px; overflow: auto; min-width: 0; }
  .viewbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  details.cat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
  details.cat.off { opacity: .55; }
  details.cat > summary { padding: 10px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  details.cat > summary .t { font-weight: 600; } details.cat > summary .count { margin-left: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { padding: 4px 14px; border-top: 1px solid var(--line); vertical-align: top; }
  td.trk { color: var(--muted); width: 45%; }
  details.notes { margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  details.notes > summary { cursor: pointer; }
  details.notes p { margin: 4px 0 0 20px; }
  /* structure tree */
  .tree { display: grid; grid-template-columns: auto auto minmax(120px, 1fr) auto auto auto; background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tree .row { display: contents; }
  .tree .row > * { padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; align-self: stretch;
                   display: flex; align-items: center; }
  .tree .row > .sw { width: 14px; height: 14px; padding: 0; margin: 6px 4px; align-self: center; border-bottom: 1px solid rgba(0,0,0,.2); }
  .tree .row.group { font-weight: 600; }
  .tree .pos, .tree .lanes { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .tree .lanes { justify-content: flex-end; }
  .tree .nm { overflow: hidden; text-overflow: ellipsis; display: block !important; line-height: 22px; }
  .tree .new { color: var(--new); font-weight: 600; }
  .tree .sw.new { outline: 2px solid var(--new); outline-offset: 1px; }
  .tree .was { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; text-decoration: line-through; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.2); }
  .key { font: 12px ui-monospace, Menlo, monospace; background: var(--chip); border-radius: 4px; padding: 0 6px; justify-self: start; }
  .key.new { background: var(--new); color: var(--accent-ink); }
  .flags { display: flex; gap: 4px; flex-wrap: wrap; }
  .flag { font-size: 11px; border-radius: 4px; padding: 0 6px; background: var(--chip); color: var(--muted); }
  .flag.on { background: var(--accent); color: var(--accent-ink); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .status { font-size: 13px; color: var(--muted); }
  .status.err { color: var(--err); } .status.ok { color: var(--ok); }
  /* action bar */
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; gap: 14px; align-items: center;
               padding: 12px 20px; background: var(--panel); border-top: 1px solid var(--line);
               box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
  .actionbar .summary { font-weight: 600; white-space: nowrap; }
  .actionbar .target { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .actionbar .spacer { flex: 1; }
  .actionbar .msg { font-size: 13px; max-width: 420px; text-align: right; }
  details.soundchip { position: relative; }
  details.soundchip > summary { list-style: none; cursor: pointer; font-size: 13px; border-radius: 14px; padding: 3px 10px;
                                background: var(--chip); white-space: nowrap; }
  details.soundchip > summary::-webkit-details-marker { display: none; }
  details.soundchip.ok > summary { color: var(--ok); } details.soundchip.caution > summary { color: var(--warn); }
  details.soundchip .pop { position: absolute; bottom: calc(100% + 10px); left: 0; width: 380px; background: var(--panel);
                           border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12px;
                           box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  details.soundchip .pop p { margin: 4px 0; }
  /* batch table */
  .progress { flex: 1; min-width: 160px; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; }
  table.batch th { position: sticky; top: 0; background: var(--panel); font-size: 11px; font-weight: 600; color: var(--muted);
                   text-align: center; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.batch th.sort { cursor: pointer; } table.batch th.sort.on { color: var(--ink); }
  table.batch th.l, table.batch td.l { text-align: left; }
  table.batch td { padding: 5px 8px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.batch td.n { color: var(--muted); }
  table.batch td.n.hit { color: var(--ink); background: var(--hit); font-weight: 600; }
  table.batch th.off, table.batch td.off { opacity: .35; }
  table.batch tr.clean td.name { color: var(--muted); }
  table.batch td.name a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); cursor: pointer; }
  table.batch td.name .ver { display: block; color: var(--muted); font-size: 11px; max-width: 260px;
                              overflow: hidden; text-overflow: ellipsis; }
  table.batch td.live.old { color: var(--warn); }
  table.batch td.todo { font-weight: 700; }
  table.batch td.res { text-align: left; font-size: 12px; max-width: 300px; white-space: normal; }
  table.batch input { accent-color: var(--accent); }
  .pill { font-size: 11px; border-radius: 4px; padding: 0 5px; background: var(--chip); color: var(--warn); cursor: help; }
  @media (max-width: 1150px) { .actionbar .target { display: none; } }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>BBB Restyle</h1>
  <div class="seg" id="mode">
    <button data-mode="single" class="on">Project</button>
    <button data-mode="batch">All projects</button>
  </div>
  <select id="folder" title="Folder"></select>
  <input id="search" type="search" placeholder="Search projects…" autocomplete="off">
  <span class="ctl" id="single-ctl">
    <select id="project"><option>Loading projects…</option></select>
    <select id="version" title="Version (newest first)"></select>
    <input id="path" type="text" placeholder="…or paste the full path of an .als">
    <button id="load" class="primary">Analyze</button>
  </span>
  <span class="ctl" id="batch-ctl" hidden>
    <button id="scan" class="primary">Scan folder</button>
  </span>
  <span id="status" class="status"></span>
</header>

<!-- ============================================================ single project -->
<main id="single">
  <aside>
    <h2>Restyle</h2>
    <div id="toggles"><p class="status">Load a project to see what differs from the template.</p></div>
  </aside>
  <div class="content">
    <div class="viewbar" id="tabsbar" hidden>
      <div class="seg" id="tabs">
        <button data-tab="findings" class="on">Differences</button>
        <button data-tab="tree">Structure</button>
      </div>
      <div class="seg" id="when" hidden>
        <button data-when="now" class="on">Now</button>
        <button data-when="after">After restyle</button>
      </div>
    </div>
    <div id="view"><div class="empty">No project loaded.</div></div>
  </div>
</main>
<div class="actionbar" id="sbar" hidden>
  <span class="summary" id="ssummary"></span>
  <span class="target" id="starget"></span>
  <details class="soundchip" id="ssound"></details>
  <span class="spacer"></span>
  <span class="msg status" id="smsg"></span>
  <button id="write" class="primary">Write new version</button>
</div>

<!-- ============================================================ all projects -->
<main id="batch" hidden>
  <aside>
    <h2>Restyle selected projects</h2>
    <div id="btoggles"></div>
  </aside>
  <div class="content">
    <div class="viewbar">
      <span id="bsummary" class="status">Scan a folder to compare every project's newest version with the template.</span>
      <div class="progress" id="bprogress" hidden><i></i></div>
    </div>
    <div id="bview"></div>
  </div>
</main>
<div class="actionbar" id="bbar" hidden>
  <span class="summary" id="bsel"></span>
  <span class="target">Each gets a new version after its newest one; originals stay untouched.</span>
  <details class="soundchip" id="bsound"></details>
  <span class="spacer"></span>
  <span class="msg status" id="bmsg"></span>
  <button id="bwrite" class="primary" disabled>Restyle selected</button>
</div>

<script>
// Live's 70-color clip/track palette (approximate sRGB), indexed 0-69
const PALETTE = ['FF94A6','FFA529','CC9927','F7F47C','BFFB00','1AFF2F','25FFA8','5CFFE8','8BC5FF','5480E4','92A7FF','D86CE4','E553A0','FFFFFF',
  'FF3636','F66C03','99724B','FFF034','87FF67','3DC300','00BFAF','19E9FF','10A4EE','007DC0','886CE4','B677C6','FF39D4','D0D0D0',
  'E2675A','FFA374','D3AD71','EDFFAE','D2E498','BAD074','9BC48D','D4FDE1','CDF1F8','B9C1E3','CDBBE4','AE98E5','E5DCE1','A9A9A9',
  'C6928B','B78256','99836A','BFBA69','A6BE00','7DB04D','88C2BA','9BB3C4','85A5C2','8393CC','A595B5','BF9FBE','BC7196','7B7B7B',
  'AF3333','A95131','724F41','DBC300','85961F','539F31','0A9C8E','236384','1A2F96','2F52A2','624BAD','A34BAD','CC2E6E','3C3C3C'];
const DESTRUCTIVE = new Set(['empty_lanes', 'dup_lanes']);
// batch table columns: categories merged into four groups
const COLGROUPS = [
  ['Names', ['group_names', 'auto_names', 'rec_names', 'returns']],
  ['Colors', ['track_colors', 'clip_colors']],
  ['Structure', ['order', 'solo_keys']],
  ['Cleanup', ['empty_lanes', 'dup_lanes']],
];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural = (n, w) => `${n} ${n === 1 ? w : w.endsWith('y') ? w.slice(0, -1) + 'ies' : w + 's'}`;
let projects = [], categories = [], data = null, tab = 'findings', when = 'now', selected = new Set(), mode = 'single';

function status(text, cls = '') { const s = $('#status'); s.textContent = text; s.className = 'status ' + cls; }
function msg(el, text, cls = '') { el.textContent = text; el.className = 'msg status ' + cls; }
async function api(url, body) {
  const r = await fetch(url, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const catTitle = k => (categories.find(c => c.key === k) || {}).title || k;

async function init() {
  [projects, categories] = await Promise.all([api('/api/projects'), api('/api/categories')]);
  const folders = [...new Set(projects.map(p => p.folder))];
  $('#folder').innerHTML = folders.map(f => `<option>${esc(f)}</option>`).join('');
  const last = store.get('bbb.project');
  if (last && projects[last]) $('#folder').value = projects[last].folder;
  fillProjects(last);
  bSelected = new Set(categories.filter(c => c.default).map(c => c.key));
  setMode(store.get('bbb.mode') || 'single');
}

function setMode(m) {
  mode = m; store.set('bbb.mode', m);
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#single').hidden = m !== 'single'; $('#batch').hidden = m !== 'batch';
  $('#single-ctl').hidden = m !== 'single'; $('#batch-ctl').hidden = m !== 'batch';
  $('#sbar').hidden = m !== 'single' || !data; $('#bbar').hidden = m !== 'batch';
  status('');
  if (m === 'batch') { buildRows(); renderBatch(); }
}

// shared bits ------------------------------------------------------------------------------
function toggleHtml(c, on, count, attr, countLabel = '') {
  return `<label class="toggle" title="${esc(c.description)}">
      <input type="checkbox" ${attr}="${c.key}" ${on ? 'checked' : ''} ${count || attr === 'data-bcat' ? '' : 'disabled'}>
      <span>${esc(c.title)}${c.sound === 'caution' ? ' <span class="pill" title="' + esc(c.sound_text) + '">⚠</span>' : ''}</span>
      <span class="count ${count ? '' : 'zero'}">${count}${countLabel}</span>
      <span class="desc">${esc(c.description)}</span></label>`;
}
function togglesHtml(cats, isOn, countOf, attr, countLabel) {
  const one = c => toggleHtml(c, isOn(c.key), countOf(c), attr, countLabel);
  return cats.filter(c => !DESTRUCTIVE.has(c.key)).map(one).join('')
    + '<div class="sep">Cleanup — removes take lanes</div>' + cats.filter(c => DESTRUCTIVE.has(c.key)).map(one).join('');
}
function renderSoundChip(el, cautionCats, warningTexts) {
  const notes = cautionCats.map(c => `<p><b>${esc(c.title)}:</b> ${esc(c.sound_text)}</p>`)
    .concat(warningTexts.map(t => `<p>${esc(t)}</p>`));
  const open = el.open;
  el.className = 'soundchip ' + (notes.length ? 'caution' : 'ok');
  el.innerHTML = `<summary>${notes.length ? '⚠ Sound unchanged · ' + plural(notes.length, 'note') : '✓ Sound unchanged'}</summary>
    <div class="pop">${notes.join('') || '<p>This selection only changes names, colors, order or keys.</p>'}
    <p class="status">Every write is verified: if anything that affects playback differs from the original, nothing is written.</p></div>`;
  el.open = open;
}
document.addEventListener('click', e => {   // close the sound popovers when clicking elsewhere
  document.querySelectorAll('details.soundchip[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
});

// ============================================================ single project
function visibleProjects() {
  const folder = $('#folder').value, q = $('#search').value.trim().toLowerCase();
  return projects.map((p, i) => [p, i]).filter(([p]) => p.folder === folder && (!q || p.project.toLowerCase().includes(q)));
}
function fillProjects(keep) {
  const shown = visibleProjects();
  $('#project').innerHTML = shown.length
    ? shown.map(([p, i]) => `<option value="${i}">${esc(p.project.replace(/ Project$/, ''))}</option>`).join('')
    : '<option value="">No matching projects</option>';
  if (keep != null && shown.some(([, i]) => String(i) === String(keep))) $('#project').value = keep;
  fillVersions();
}
function fillVersions() {
  const p = projects[$('#project').value];
  if (!p) { $('#version').innerHTML = ''; return; }
  $('#version').innerHTML = p.versions.map((v, i) => `<option value="${esc(v)}">${esc(v)}${i === 0 ? '  (newest)' : ''}</option>`).join('');
}
function currentPath() {
  const typed = $('#path').value.trim();
  if (typed) return typed;
  const p = projects[$('#project').value];
  if (!p) throw new Error('Pick a project first');
  return p.dir + $('#version').value;
}

async function analyze() {
  let path;
  try { path = currentPath(); } catch (e) { return status(e.message, 'err'); }
  $('#load').disabled = true; status('Reading ' + path.split('/').pop() + '…');
  store.set('bbb.project', $('#project').value);
  try {
    data = await api('/api/analyze', {path});
    selected = new Set(data.categories.filter(c => c.default).map(c => c.key));
    status(`${data.file} · ${data.live}`, '');
    msg($('#smsg'), '');
    render();
  } catch (e) { status(e.message, 'err'); }
  $('#load').disabled = false;
}

function render() {
  $('#toggles').innerHTML = togglesHtml(data.categories, k => selected.has(k), c => c.items.length, 'data-cat');
  $('#toggles').querySelectorAll('input').forEach(i => i.onchange = () => {
    i.checked ? selected.add(i.dataset.cat) : selected.delete(i.dataset.cat); renderView(); updateWrite();
  });
  $('#tabsbar').hidden = false; $('#sbar').hidden = mode !== 'single';
  updateWrite(); renderView();
}

function updateWrite() {
  armed = false;
  const cats = data.categories.filter(c => selected.has(c.key) && c.items.length);
  const n = cats.reduce((a, c) => a + c.items.length, 0);
  $('#ssummary').textContent = n ? `${plural(n, 'change')} in ${plural(cats.length, 'category')}` : 'Nothing selected';
  $('#starget').textContent = n ? '→ ' + data.next : '';
  const warns = data.warnings.filter(w => !w.categories.length || w.categories.some(k => selected.has(k))).map(w => w.text);
  renderSoundChip($('#ssound'), cats.filter(c => c.sound === 'caution'), warns);
  $('#write').disabled = n === 0;
  $('#write').textContent = 'Write new version';
}

// the track list as it will be after applying the selected categories
function afterTracks() {
  const ts = data.tracks.map(t => ({...t, was: {}}));
  const byId = new Map(ts.map(t => [t.id, t]));
  let order = null;
  for (const c of data.categories) {
    if (!selected.has(c.key)) continue;
    for (const it of c.items) {
      const e = it.effect || {}, t = byId.get(it.id);
      if (e.order) { order = e.order; continue; }
      if (!t) continue;
      if ('name' in e) { t.was.name = t.name; t.name = e.name; }
      if ('color' in e) { t.was.color = t.color; t.color = e.color; }
      if ('solo' in e) { t.was.solo = t.solo; t.solo = e.solo; }
      if ('lanes' in e) { t.was.lanes = t.was.lanes ?? t.lanes; t.lanes += e.lanes; }
    }
  }
  if (!order) return ts;
  const before = ts.filter(t => t.depth === 0).map(t => t.id);
  const out = order.map(id => byId.get(id)).filter(Boolean);
  const after = out.filter(t => t.depth === 0).map(t => t.id);
  out.forEach(t => { if (t.depth === 0 && before.indexOf(t.id) !== after.indexOf(t.id)) t.was.pos = true; });
  return out;
}

function renderView() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('#when button').forEach(b => b.classList.toggle('on', b.dataset.when === when));
  $('#when').hidden = tab !== 'tree';
  const notesOpen = $('#view details.notes') && $('#view details.notes').open;
  const notes = data.notes.length ? `<details class="notes" ${notesOpen ? 'open' : ''}>
      <summary>ⓘ ${plural(data.notes.length, 'thing')} left as is</summary>${data.notes.map(n => `<p>${esc(n)}</p>`).join('')}</details>` : '';
  if (tab === 'findings') {
    const open = new Set([...document.querySelectorAll('#view details.cat[open]')].map(d => d.dataset.cat));
    const blocks = data.categories.filter(c => c.items.length).map(c => `
      <details class="cat ${selected.has(c.key) ? '' : 'off'}" data-cat="${c.key}" ${open.has(c.key) ? 'open' : ''}>
        <summary><span class="t">${esc(c.title)}</span><span class="status">${selected.has(c.key) ? 'will change' : 'skipped'}</span>
        <span class="count">${c.items.length}</span></summary>
        <table>${c.items.map(i => `<tr><td class="trk">${esc(i.track)}</td><td>${esc(i.detail)}</td></tr>`).join('')}</table>
      </details>`).join('');
    $('#view').innerHTML = notes + (blocks || '<div class="empty">Already matches the template.</div>');
    return;
  }
  const short = {group_names:'name', solo_keys:'key', track_colors:'color', clip_colors:'clips', auto_names:'name',
                 rec_names:'rec', returns:'return', empty_lanes:'empty lanes', dup_lanes:'dup lanes'};
  const after = when === 'after';
  const rows = after ? afterTracks() : data.tracks;
  $('#view').innerHTML = notes + '<div class="tree">' + rows.map(t => {
    const w = t.was || {};
    const extra = after
      ? ('name' in w ? `<span class="was">${esc(w.name)}</span>` : '') + (w.pos ? ' <span class="flag on">moved</span>' : '')
      : '';
    const flags = after ? (t.flags.includes('clip_colors') && selected.has('clip_colors') ? '<span class="flag on">clips</span>' : '')
      : t.flags.map(f => `<span class="flag ${selected.has(f) ? 'on' : ''}">${short[f] || f}</span>`).join('');
    const key = t.solo ? `<span class="key ${after && 'solo' in w ? 'new' : ''}">${esc(t.solo)}</span>`
      : (after && w.solo ? `<span class="key new" title="key ${esc(w.solo)} removed">–</span>` : '');
    return `<div class="row ${t.type === 'Group' ? 'group' : ''}">
      <span class="pos">#${t.pos}</span>
      <span class="sw ${after && 'color' in w ? 'new' : ''}" style="background:#${PALETTE[t.color] || '888'}" title="color ${t.color}${'color' in w ? ' (was ' + w.color + ')' : ''}"></span>
      <span class="nm" style="padding-left:${6 + t.depth * 18}px"><span class="${after && 'name' in w ? 'new' : ''}">${esc(t.name)}</span>${extra}</span>
      <span>${key}</span>
      <span class="lanes ${after && 'lanes' in w ? 'new' : ''}">${t.lanes ? t.lanes + ' lanes' : (after && 'lanes' in w ? '0 lanes' : '')}</span>
      <span class="flags">${flags}</span></div>`;
  }).join('') + '</div>';
}

// No confirm() dialog: some browsers (and embedded panes) block it silently.
// Removing take lanes needs a second click on the button instead.
let armed = false;
async function write() {
  const cats = [...selected].filter(k => data.categories.find(c => c.key === k).items.length);
  if (cats.some(k => DESTRUCTIVE.has(k)) && !armed) {
    armed = true;
    $('#write').textContent = 'Click again: also removes take lanes';
    msg($('#smsg'), 'The original file stays untouched.');
    return;
  }
  armed = false;
  $('#write').disabled = true; $('#write').textContent = 'Writing…';
  msg($('#smsg'), 'Writing and verifying, 10–20 seconds…');
  try {
    const r = await api('/api/write', {path: data.path, categories: cats});
    msg($('#smsg'), `✓ Wrote ${r.file} (${plural(r.changes, 'change')}) · sound check passed`, 'ok');
    await refreshProjects();
    data.next = (await api('/api/analyze', {path: data.path})).next;
  } catch (e) { msg($('#smsg'), 'Failed: ' + e.message, 'err'); }
  updateWrite();
}

async function refreshProjects() {
  const keep = $('#project').value, ver = $('#version').value;
  projects = await api('/api/projects');
  fillProjects(keep);
  if ([...$('#version').options].some(o => o.value === ver)) $('#version').value = ver;
}

function openInSingle(i, version) {
  setMode('single');
  $('#path').value = '';
  fillProjects(i); $('#project').value = i; fillVersions();
  if (version) $('#version').value = version;
  analyze();
}

// ============================================================ all projects (batch)
let bSelected = new Set(), rows = [], checked = new Set(), bArmed = false, polling = null, jobKind = null, sortBy = 'name';

function buildRows() {
  const prev = new Map(rows.map(r => [r.path, r]));
  rows = visibleProjects().map(([p, i]) => {
    const path = p.dir + p.versions[0];
    const old = prev.get(path);
    return {i, name: p.project.replace(/ Project$/, ''), path, file: p.versions[0],
            scan: old ? old.scan : null, write: old ? old.write : null};
  });
}
function countsOf(r) { return r.scan && r.scan.ok ? r.scan.data.counts : null; }
function selectedCount(r) {
  const c = countsOf(r); if (!c) return 0;
  return [...bSelected].reduce((a, k) => a + (c[k] || 0), 0);
}
const isOldLive = live => { const m = /Live (\d+)/.exec(live || ''); return !!m && +m[1] < 12; };
const realWarnings = r => (r.scan && r.scan.ok ? r.scan.data.warnings : []).filter(w => w.kind !== 'live_version');

function renderBatchToggles() {
  const projs = c => rows.reduce((a, r) => a + ((countsOf(r) || {})[c.key] ? 1 : 0), 0);
  $('#btoggles').innerHTML = togglesHtml(categories, k => bSelected.has(k), projs, 'data-bcat', ' proj');
  $('#btoggles').querySelectorAll('input').forEach(i => i.onchange = () => {
    i.checked ? bSelected.add(i.dataset.bcat) : bSelected.delete(i.dataset.bcat); renderBatch();
  });
}

function renderBatch() {
  renderBatchToggles();
  if (!rows.length) { $('#bview').innerHTML = '<div class="empty">No projects match.</div>'; updateBatchWrite(); return; }
  const sorted = [...rows].sort((a, b) => sortBy === 'todo'
    ? (selectedCount(b) - selectedCount(a)) || a.name.localeCompare(b.name) : a.name.localeCompare(b.name));
  const head = `<tr><th><input type="checkbox" id="checkall" title="Select all with changes"></th>
    <th class="l sort ${sortBy === 'name' ? 'on' : ''}" data-sort="name" title="Sort by name">Project ${sortBy === 'name' ? '↓' : ''}</th>
    <th>Live</th>
    ${COLGROUPS.map(([t, ks]) => `<th class="${ks.some(k => bSelected.has(k)) ? '' : 'off'}"
       title="${esc(ks.map(catTitle).join(', '))}">${t}</th>`).join('')}
    <th class="sort ${sortBy === 'todo' ? 'on' : ''}" data-sort="todo" title="Sort by number of changes">To do ${sortBy === 'todo' ? '↓' : ''}</th>
    <th class="l">Result</th></tr>`;
  const body = sorted.map(r => {
    const c = countsOf(r), n = selectedCount(r);
    const live = r.scan && r.scan.ok ? r.scan.data.live || '' : '';
    const warns = realWarnings(r);
    const pill = warns.length ? ` <span class="pill" title="${esc(warns.map(w => w.text).join(' '))}">!</span>` : '';
    const cells = COLGROUPS.map(([, ks]) => {
      const on = ks.filter(k => bSelected.has(k));
      const v = c ? on.reduce((a, k) => a + (c[k] || 0), 0) : '';
      const tip = c ? ks.map(k => `${catTitle(k)}: ${c[k] || 0}${bSelected.has(k) ? '' : ' (off)'}`).join('\n') : '';
      return `<td class="n ${on.length ? '' : 'off'} ${v ? 'hit' : ''}" title="${esc(tip)}">${c ? (v || '·') : ''}</td>`;
    }).join('');
    let res = '';
    if (r.scan && !r.scan.ok) res = `<span class="status err">${esc(r.scan.error)}</span>`;
    else if (!r.scan) res = '<span class="status">not scanned</span>';
    if (r.write) res = r.write.ok
      ? `<span class="status ok">✓ wrote ${esc(r.write.data.file)}</span>`
      : `<span class="status err">✗ ${esc(r.write.error)}</span>`;
    else if (r.pending) res = '<span class="status">writing…</span>';
    return `<tr class="${c && !n ? 'clean' : ''}">
      <td><input type="checkbox" data-path="${esc(r.path)}" ${checked.has(r.path) ? 'checked' : ''} ${n ? '' : 'disabled'}></td>
      <td class="l name"><a data-open="${r.i}" data-ver="${esc(r.file)}" title="Open in project view">${esc(r.name)}</a>${pill}
        <span class="ver" title="${esc(r.file)}">${esc(r.file)}</span></td>
      <td class="n live ${isOldLive(live) ? 'old' : ''}" title="${isOldLive(live) ? 'Saved by an older Live; saving the new version from Live 12 upgrades it' : ''}">${esc(live.replace('Ableton Live ', ''))}</td>
      ${cells}<td class="todo">${c ? (n || '✓') : ''}</td><td class="res">${res}</td></tr>`;
  }).join('');
  $('#bview').innerHTML = `<div class="tablewrap"><table class="batch"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  $('#bview').querySelectorAll('input[data-path]').forEach(i => i.onchange = () => {
    i.checked ? checked.add(i.dataset.path) : checked.delete(i.dataset.path); updateBatchWrite();
  });
  $('#checkall').onchange = e => {
    rows.forEach(r => { if (e.target.checked && selectedCount(r)) checked.add(r.path); else checked.delete(r.path); });
    renderBatch();
  };
  $('#bview').querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => { sortBy = th.dataset.sort; renderBatch(); });
  $('#bview').querySelectorAll('a[data-open]').forEach(a => a.onclick = () => openInSingle(a.dataset.open, a.dataset.ver));
  const scanned = rows.filter(r => r.scan);
  const todo = scanned.filter(r => selectedCount(r)).length;
  if (!polling) $('#bsummary').textContent = scanned.length
    ? `${scanned.length} of ${rows.length} projects scanned · ${todo} differ from the template for the selected categories`
    : `${rows.length} projects in this folder. Scan to compare their newest versions with the template.`;
  updateBatchWrite();
}

function updateBatchWrite() {
  bArmed = false;
  rows.forEach(r => { if (!selectedCount(r)) checked.delete(r.path); });
  const sel = rows.filter(r => checked.has(r.path));
  const n = sel.reduce((a, r) => a + selectedCount(r), 0);
  $('#bsel').textContent = sel.length ? `${plural(sel.length, 'project')} · ${plural(n, 'change')}` : 'No projects selected';
  const cautions = categories.filter(c => c.sound === 'caution' && bSelected.has(c.key) && sel.some(r => (countsOf(r) || {})[c.key]));
  const groups = new Map();
  sel.forEach(r => r.scan.data.warnings.forEach(w => {
    if (w.categories.length && !w.categories.some(k => bSelected.has(k))) return;
    const key = w.kind === 'live_version'
      ? 'saved by an older Live; the new version sounds the same, but saving it from Live 12 upgrades it for good.'
      : w.text.replace(/This set has \d+/, 'has');
    groups.set(key, (groups.get(key) || 0) + 1);
  }));
  renderSoundChip($('#bsound'), cautions, [...groups].map(([t, k]) => `${plural(k, 'project')}: ${t}`));
  const busy = !!polling;
  $('#bwrite').disabled = busy || !sel.length;
  $('#bwrite').textContent = busy && jobKind === 'write' ? 'Writing…' : sel.length ? `Restyle ${plural(sel.length, 'project')}` : 'Restyle selected';
  $('#scan').disabled = busy;
}

async function scan() {
  buildRows();
  if (!rows.length) return;
  rows.forEach(r => { r.write = null; });
  try { await api('/api/batch/scan', {paths: rows.map(r => r.path)}); } catch (e) { return status(e.message, 'err'); }
  startPolling('scan');
}

async function batchWrite() {
  const sel = rows.filter(r => checked.has(r.path));
  const cats = [...bSelected];
  const removesLanes = sel.some(r => cats.some(k => DESTRUCTIVE.has(k) && countsOf(r)[k]));
  if (removesLanes && !bArmed) {
    bArmed = true;
    $('#bwrite').textContent = 'Click again: also removes take lanes';
    msg($('#bmsg'), 'Originals stay untouched.');
    return;
  }
  bArmed = false;
  sel.forEach(r => { r.write = null; r.pending = true; });
  try { await api('/api/batch/write', {paths: sel.map(r => r.path), categories: cats}); }
  catch (e) { sel.forEach(r => { r.pending = false; }); return msg($('#bmsg'), e.message, 'err'); }
  msg($('#bmsg'), ''); startPolling('write');
}

function startPolling(kind) {
  jobKind = kind;
  $('#bprogress').hidden = false;
  const tick = async () => {
    let j;
    try { j = (await api('/api/job')).job; } catch (e) { return; }
    if (!j) return;
    $('#bprogress i').style.width = (100 * j.done / Math.max(1, j.total)) + '%';
    $('#bsummary').textContent = `${kind === 'scan' ? 'Scanning' : 'Writing and verifying'}… ${j.done} of ${j.total}`;
    rows.forEach(r => {
      const res = j.results[r.path];
      if (!res) return;
      if (j.kind === 'scan') r.scan = res; else { r.write = res; r.pending = false; }
    });
    if (!j.running) {
      clearInterval(polling); polling = null; $('#bprogress').hidden = true;
      if (j.kind === 'write') {
        const ok = Object.values(j.results).filter(x => x.ok).length, failed = j.total - ok;
        msg($('#bmsg'), `✓ Wrote ${plural(ok, 'new version')}${failed ? `, ${failed} failed` : ''} · sound check passed`, failed ? 'err' : 'ok');
        checked.clear();
        projects = await api('/api/projects');
        fillProjects($('#project').value);
        const results = new Map(rows.map(r => [r.name, r.write]));
        buildRows(); rows.forEach(r => { r.write = results.get(r.name) || null; });
      }
    }
    renderBatch();
  };
  polling = setInterval(tick, 1000);
  tick();
  updateBatchWrite();
}

// ============================================================ wiring
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('#project').onchange = () => { $('#path').value = ''; fillVersions(); };
$('#folder').onchange = () => { fillProjects($('#project').value); if (mode === 'batch') { buildRows(); renderBatch(); } };
$('#search').oninput = () => { fillProjects($('#project').value); if (mode === 'batch') { buildRows(); renderBatch(); } };
$('#search').onkeydown = e => { if (e.key === 'Enter') (mode === 'batch' ? scan() : analyze()); };
$('#load').onclick = analyze;
$('#write').onclick = write;
$('#scan').onclick = scan;
$('#bwrite').onclick = batchWrite;
$('#path').onkeydown = e => { if (e.key === 'Enter') analyze(); };
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderView(); });
document.querySelectorAll('#when button').forEach(b => b.onclick = () => { when = b.dataset.when; renderView(); });
init().catch(e => status(e.message, 'err'));
</script>
</body>
</html>
